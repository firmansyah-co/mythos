[package]
name = "mythos-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MythOS Industrial Workbench Desktop App"

[lib]
name = "mythos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.12", features = [] }
mythos-core = { workspace = true }
mythos-pal = { workspace = true }
mythos-shm = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
