name: advisor
version: "1.0"
description: "Executive Advisor & Chief of Staff. Primary human interface, single funnel for every question that needs Adrian's decision."

defaults:
  runtime: claude-code
  model: claude-fable-5.2

imports:
  - ref: path:/home/adrian/.local/lib/node_modules/@openrig/cli/daemon/specs/agents/shared

profiles:
  default:
    uses:
      skills: [development-team, messaging-the-human, delegating-work]
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      orientation: role
      delivery_hint: send_text
      required: true
  actions: []
