name: desk
version: "1.0"
description: "The waiting room. Presents every open human decision as a clickable question and records the answer back onto its queue row. Decides nothing."

defaults:
  runtime: claude-code
  model: 

imports:
  - ref: path:/home/adrian/.local/lib/node_modules/@openrig/cli/daemon/specs/agents/shared

profiles:
  default:
    uses:
      skills: [messaging-the-human, queue-handoff]
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      orientation: role
      delivery_hint: send_text
      required: true
  actions: []
