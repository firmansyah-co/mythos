[workspace]
resolver = "2"
members = [
    "crates/mythos-pal",
    "crates/mythos-core",
    "crates/mythos-shm",
    "crates/mythos-plugin-sdk",
    "crates/mythos-module",
    "crates/mythos-module-tests",
    "crates/mythos-cli",
    "crates/mythos-update",
    "crates/mythos-logic-ir",
    "crates/mythos-logic-st",
    "crates/mythos-logic-vm",
    "crates/mythos-logic-backend-vm",
    "crates/mythos-logic-compiler",
    "crates/mythos-logic-graphic",
    "plugins/drivers/driver-modbus",
    "plugins/hmi",
    "plugins/discovery",
    "plugins/runtime-vm",
    "plugins/logic",
    "plugins/data",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89: the data module holds a lock between processes with `std::fs::File::lock`, stable since
# then (ADR-014, D3). A workspace member cannot ask for more than the workspace says it needs.
rust-version = "1.89.0"
authors = ["adrianaryaputra <adrian@firmansyah.co>"]
license = "MPL-2.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
# Internal Workspace Crates
mythos-pal = { path = "crates/mythos-pal" }
mythos-shm = { path = "crates/mythos-shm" }
mythos-core = { path = "crates/mythos-core" }
mythos-plugin-sdk = { path = "crates/mythos-plugin-sdk" }
mythos-module = { path = "crates/mythos-module" }
mythos-update = { path = "crates/mythos-update" }
mythos-logic-ir = { path = "crates/mythos-logic-ir" }
mythos-logic-st = { path = "crates/mythos-logic-st" }
mythos-logic-vm = { path = "crates/mythos-logic-vm" }
mythos-logic-backend-vm = { path = "crates/mythos-logic-backend-vm" }
mythos-logic-compiler = { path = "crates/mythos-logic-compiler" }
mythos-logic-graphic = { path = "crates/mythos-logic-graphic" }
driver-modbus = { path = "plugins/drivers/driver-modbus" }

# Concurrency and Async
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"

# Web, Networking and API Gateway
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"

# CLI & Packaging
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tempfile = "3.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# PLCopen TC6 XML, read by the Ladder Diagram front-end. MIT.
quick-xml = "0.42"
bytemuck = { version = "1.18", features = ["derive"] }
ts-rs = "10.0"

# Logging and Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"

# Low-level and Systems
libc = "0.2"
libloading = "0.8"
crc32fast = "1.4"
cfg-if = "1.0"

# Hashing a release bundle (about 100 MB in a debug build) takes seconds unoptimised; the
# updater's tests do it several times.
[profile.dev.package.sha2]
opt-level = 3

# Password hashing is deliberately slow; unoptimised, the auth tests would spend most of their
# time in it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3


# Packing a module package deflates whole executables; unoptimised that takes most of a test run.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3
