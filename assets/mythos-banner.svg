<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%" style="background:#080b11; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#080b11" stop-opacity="1"/>
    </radialGradient>

    <!-- Logo Gradient: Electric Amber to Vivid Rust -->
    <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Logo Gradient: Cyan Pulse Accent -->
    <linearGradient id="logo-grad-secondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="280" fill="url(#bg-glow)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.025" stroke="#94a3b8" stroke-width="1">
    <pattern id="banner-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="280" fill="url(#banner-grid)"/>
  </g>

  <!-- Centered Composition -->
  <g transform="translate(600, 140)">
    <!-- Ambient Halo Glow behind Logo -->
    <circle cx="0" cy="-45" r="85" fill="#f97316" opacity="0.08" filter="url(#core-glow)"/>
    <circle cx="0" cy="-45" r="45" fill="#38bdf8" opacity="0.06" filter="url(#core-glow)"/>

    <!-- ======================================================== -->
    <!-- MINIMALIST GEOMETRIC ICON: PRECISION CRUCIBLE "M"        -->
    <!-- ======================================================== -->
    <g transform="translate(-36, -92) scale(0.72)">
      <!-- Left Pylon -->
      <path d="M 12 100 L 12 24 L 38 48 L 38 100 Z" fill="url(#logo-grad-primary)"/>
      
      <!-- Right Pylon -->
      <path d="M 88 100 L 88 24 L 62 48 L 62 100 Z" fill="url(#logo-grad-primary)"/>

      <!-- Center Dynamic Chevron / Core Node -->
      <path d="M 50 16 L 72 38 L 50 60 L 28 38 Z" fill="url(#logo-grad-secondary)" filter="url(#core-glow)"/>
      <path d="M 50 24 L 64 38 L 50 52 L 36 38 Z" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- Brand Typography -->
    <text x="0" y="32" fill="#f8fafc" font-size="46" font-weight="800" letter-spacing="-1.5" text-anchor="middle">MythOS</text>
    
    <!-- Official Subtitle Tagline (Adrian Mandate) -->
    <text x="0" y="68" fill="#94a3b8" font-size="14.5" font-weight="500" letter-spacing="1.2" text-anchor="middle">SCADA for the future of open and autonomous industrial automation</text>
  </g>
</svg>