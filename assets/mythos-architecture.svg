<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" style="background:#080b11; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="box-ui" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c2e"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>

    <linearGradient id="box-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24170a"/>
      <stop offset="100%" stop-color="#140c04"/>
    </linearGradient>

    <linearGradient id="box-plugins" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2417"/>
      <stop offset="100%" stop-color="#06140d"/>
    </linearGradient>

    <linearGradient id="box-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f112e"/>
      <stop offset="100%" stop-color="#12081c"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="dot-blue" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6">
      <circle cx="4" cy="4" r="3" fill="#38bdf8"/>
    </marker>
    <marker id="dot-orange" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6">
      <circle cx="4" cy="4" r="3" fill="#f97316"/>
    </marker>
    <marker id="dot-green" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6">
      <circle cx="4" cy="4" r="3" fill="#10b981"/>
    </marker>
    
    <!-- Drop Shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="#080b11"/>

  <!-- Subtle Minimal Grid -->
  <g opacity="0.03" stroke="#94a3b8" stroke-width="1">
    <pattern id="arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1000" height="420" fill="url(#arch-grid)"/>
  </g>

  <!-- ============================================== -->
  <!-- 4 HORIZONTAL ARCHITECTURAL PILLARS (CLEAN & ELEGANT) -->
  <!-- ============================================== -->

  <!-- 1. FRONTEND STUDIO -->
  <g transform="translate(40, 50)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="200" height="340" rx="12" fill="url(#box-ui)" stroke="#1e293b" stroke-width="1.5"/>
    
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#0369a1" opacity="0.4"/>
    <text x="32" y="37" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="60" y="31" fill="#f8fafc" font-size="13" font-weight="700">Web Studio</text>
    <text x="60" y="45" fill="#64748b" font-size="10">React 19 • Dockview</text>

    <!-- Sub-items -->
    <g transform="translate(16, 75)">
      <rect x="0" y="0" width="168" height="42" rx="6" fill="#070d18" stroke="#172554" stroke-width="1"/>
      <text x="12" y="18" fill="#e2e8f0" font-size="11" font-weight="600">P&amp;ID &amp; HMI Canvas</text>
      <text x="12" y="32" fill="#94a3b8" font-size="9">120x68 Virtual Grid</text>

      <rect x="0" y="52" width="168" height="42" rx="6" fill="#070d18" stroke="#172554" stroke-width="1"/>
      <text x="12" y="70" fill="#e2e8f0" font-size="11" font-weight="600">Monaco ST &amp; Ladder</text>
      <text x="12" y="84" fill="#94a3b8" font-size="9">In-Canvas Soft-Logic</text>

      <rect x="0" y="104" width="168" height="42" rx="6" fill="#070d18" stroke="#172554" stroke-width="1"/>
      <text x="12" y="122" fill="#e2e8f0" font-size="11" font-weight="600">384px Modular Deck</text>
      <text x="12" y="136" fill="#94a3b8" font-size="9">iOS-Style S/M/L Cards</text>

      <rect x="0" y="156" width="168" height="42" rx="6" fill="#070d18" stroke="#172554" stroke-width="1"/>
      <text x="12" y="174" fill="#e2e8f0" font-size="11" font-weight="600">Real-Time Collab</text>
      <text x="12" y="188" fill="#94a3b8" font-size="9">CRDT Multi-Cursors (Yjs)</text>

      <rect x="0" y="208" width="168" height="42" rx="6" fill="#070d18" stroke="#172554" stroke-width="1"/>
      <text x="12" y="226" fill="#e2e8f0" font-size="11" font-weight="600">Fullscreen Kiosk</text>
      <text x="12" y="240" fill="#94a3b8" font-size="9">WinCC Operator Mode</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <g transform="translate(240, 220)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="20" cy="0" r="10" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="20" y="3" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">SSE</text>
    <text x="20" y="-14" fill="#64748b" font-size="9" text-anchor="middle">100ms</text>
  </g>

  <!-- 2. HARDENED MICROKERNEL -->
  <g transform="translate(280, 50)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="200" height="340" rx="12" fill="url(#box-core)" stroke="#5c3818" stroke-width="1.5"/>
    
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#7c2d12" opacity="0.4"/>
    <text x="32" y="37" fill="#f97316" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="60" y="31" fill="#f8fafc" font-size="13" font-weight="700">Microkernel</text>
    <text x="60" y="45" fill="#a8a29e" font-size="10">crates/mythos-core</text>

    <!-- Sub-items -->
    <g transform="translate(16, 75)">
      <rect x="0" y="0" width="168" height="52" rx="6" fill="#170c04" stroke="#431407" stroke-width="1"/>
      <text x="12" y="20" fill="#fdba74" font-size="11" font-weight="700">Lock-Free TagBus</text>
      <text x="12" y="34" fill="#fed7aa" font-size="10">/dev/shm/mythos_tagbus</text>
      <text x="12" y="46" fill="#a8a29e" font-size="8.5">Triple-Buffered (&lt; 50 ns)</text>

      <rect x="0" y="62" width="168" height="52" rx="6" fill="#170c04" stroke="#431407" stroke-width="1"/>
      <text x="12" y="82" fill="#fdba74" font-size="11" font-weight="700">Plant Hierarchy</text>
      <text x="12" y="96" fill="#fed7aa" font-size="9.5">external.&lt;loc&gt;.&lt;dev&gt;.&lt;var&gt;</text>
      <text x="12" y="108" fill="#a8a29e" font-size="8.5">RO / WO / RW Shadow Buffer</text>

      <rect x="0" y="124" width="168" height="52" rx="6" fill="#170c04" stroke="#431407" stroke-width="1"/>
      <text x="12" y="144" fill="#fdba74" font-size="11" font-weight="700">Plugin Host SPI</text>
      <text x="12" y="158" fill="#fed7aa" font-size="10">Capability Sandbox</text>
      <text x="12" y="170" fill="#a8a29e" font-size="8.5">Panic-isolated supervisor</text>

      <rect x="0" y="186" width="168" height="52" rx="6" fill="#170c04" stroke="#431407" stroke-width="1"/>
      <text x="12" y="206" fill="#fdba74" font-size="11" font-weight="700">Autosave &amp; WAL</text>
      <text x="12" y="220" fill="#fed7aa" font-size="10">Two-Tier Storage</text>
      <text x="12" y="232" fill="#a8a29e" font-size="8.5">Crash-resilient /var/lib/mythos</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <g transform="translate(480, 220)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#ea580c" stroke-width="2"/>
    <circle cx="20" cy="0" r="10" fill="#431407" stroke="#ea580c" stroke-width="1"/>
    <text x="20" y="3" fill="#fed7aa" font-size="8" font-weight="700" text-anchor="middle">SPI</text>
    <text x="20" y="-14" fill="#a8a29e" font-size="9" text-anchor="middle">&lt; 15ms</text>
  </g>

  <!-- 3. PLUGINS (EVERYTHING IS A PLUGIN) -->
  <g transform="translate(520, 50)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="200" height="340" rx="12" fill="url(#box-plugins)" stroke="#14532d" stroke-width="1.5"/>
    
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#064e3b" opacity="0.4"/>
    <text x="32" y="37" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="60" y="31" fill="#f8fafc" font-size="13" font-weight="700">Backend Plugins</text>
    <text x="60" y="45" fill="#86efac" font-size="10">Pluggable Ecosystem</text>

    <!-- Sub-items -->
    <g transform="translate(16, 75)">
      <rect x="0" y="0" width="168" height="42" rx="6" fill="#041f12" stroke="#166534" stroke-width="1"/>
      <text x="12" y="18" fill="#dcfce7" font-size="11" font-weight="600">engine-strucpp</text>
      <text x="12" y="32" fill="#86efac" font-size="9">STruC++ C-ABI • SCHED_FIFO</text>

      <rect x="0" y="52" width="168" height="42" rx="6" fill="#041f12" stroke="#166534" stroke-width="1"/>
      <text x="12" y="70" fill="#dcfce7" font-size="11" font-weight="600">engine-alarms</text>
      <text x="12" y="84" fill="#86efac" font-size="9">ISA-18.2 First-Out Latching</text>

      <rect x="0" y="104" width="168" height="42" rx="6" fill="#041f12" stroke="#166534" stroke-width="1"/>
      <text x="12" y="122" fill="#dcfce7" font-size="11" font-weight="600">engine-recipes</text>
      <text x="12" y="136" fill="#86efac" font-size="9">ISA-88 Batch Procedure</text>

      <rect x="0" y="156" width="168" height="42" rx="6" fill="#041f12" stroke="#166534" stroke-width="1"/>
      <text x="12" y="174" fill="#dcfce7" font-size="11" font-weight="600">engine-historian</text>
      <text x="12" y="188" fill="#86efac" font-size="9">Parquet Columnar • SDC</text>

      <rect x="0" y="208" width="168" height="42" rx="6" fill="#041f12" stroke="#166534" stroke-width="1"/>
      <text x="12" y="226" fill="#dcfce7" font-size="11" font-weight="600">driver-modbus / dcp</text>
      <text x="12" y="240" fill="#86efac" font-size="9">RTU/TCP • Layer 2 Broadcast</text>
    </g>
  </g>

  <!-- CONNECTOR 3 -> 4 -->
  <g transform="translate(720, 220)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#10b981" stroke-width="2"/>
    <circle cx="20" cy="0" r="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="3" fill="#6ee7b7" font-size="8" font-weight="700" text-anchor="middle">I/O</text>
    <text x="20" y="-14" fill="#6ee7b7" font-size="9" text-anchor="middle">Field/AI</text>
  </g>

  <!-- 4. PHYSICAL FIELD & AI (OUTER WORLD) -->
  <g transform="translate(760, 50)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="200" height="340" rx="12" fill="url(#box-edge)" stroke="#581c87" stroke-width="1.5"/>
    
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#3b0764" opacity="0.4"/>
    <text x="32" y="37" fill="#c084fc" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <text x="60" y="31" fill="#f8fafc" font-size="13" font-weight="700">Outer World</text>
    <text x="60" y="45" fill="#d8b4fe" font-size="10">Hardware &amp; AI Agents</text>

    <!-- Sub-items -->
    <g transform="translate(16, 75)">
      <!-- AI MCP Box -->
      <rect x="0" y="0" width="168" height="110" rx="6" fill="#130820" stroke="#6b21a8" stroke-width="1"/>
      <rect x="12" y="12" width="70" height="18" rx="3" fill="#3b0764"/>
      <text x="16" y="24" fill="#c084fc" font-size="9" font-weight="700">AI COPILOT</text>
      <text x="12" y="45" fill="#f3e8ff" font-size="11" font-weight="600">Model Context Protocol</text>
      <text x="12" y="60" fill="#c084fc" font-size="9.5">Claude • Antigravity • LLMs</text>
      <text x="12" y="78" fill="#94a3b8" font-size="8.5">• Direct tag introspection</text>
      <text x="12" y="92" fill="#94a3b8" font-size="8.5">• Auto-contributed tools</text>

      <!-- Physical Plant Hardware Box -->
      <rect x="0" y="125" width="168" height="125" rx="6" fill="#130820" stroke="#6b21a8" stroke-width="1"/>
      <rect x="12" y="137" width="80" height="18" rx="3" fill="#3b0764"/>
      <text x="16" y="149" fill="#c084fc" font-size="9" font-weight="700">PLANT I/O BUS</text>
      <text x="12" y="170" fill="#f3e8ff" font-size="11" font-weight="600">Physical Instruments</text>
      <text x="12" y="185" fill="#c084fc" font-size="9.5">RS-485 • Ethernet • CAN</text>
      <text x="12" y="202" fill="#94a3b8" font-size="8.5">• Supmea P300, SenTec Rain</text>
      <text x="12" y="216" fill="#94a3b8" font-size="8.5">• VFD Inverters &amp; Valves</text>
      <text x="12" y="230" fill="#94a3b8" font-size="8.5">• Modular Remote I/O Racks</text>
    </g>
  </g>

</svg>