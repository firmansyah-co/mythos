[package]
name = "mythos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "MythOS Multi-Channel Lifecycle Manager, Plugin CLI and Distribution Toolchain"

[[bin]]
name = "mythos"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mythos-core.workspace = true
mythos-plugin-sdk.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
sha2.workspace = true
zip.workspace = true
ureq = { version = "3.2.1", default-features = false, features = ["rustls", "json"] }
semver = "1.0.28"

[dev-dependencies]
axum = { workspace = true, features = ["tokio"] }
tempfile.workspace = true

[target."cfg(windows)".dependencies]
junction = "2.0.0"
