[package]
name = "mythos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Microkernel Host Daemon, Actor Supervisor and Service Coordinator for MythOS"

[lints]
workspace = true

[dependencies]
mythos-pal.workspace = true
mythos-shm.workspace = true
mythos-plugin-sdk.workspace = true
driver-modbus.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
crc32fast.workspace = true
sha2.workspace = true
zip.workspace = true
rand.workspace = true
hex.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
ts-rs = { workspace = true, features = ["serde-json-impl", "no-serde-warnings"] }

yrs = { workspace = true }

[dev-dependencies]
# The Modbus device simulator, for the end-to-end read path tests.
driver-modbus = { workspace = true, features = ["sim"] }
tempfile = "3.10"
tokio-tungstenite = "0.24"
futures-util = "0.3"
