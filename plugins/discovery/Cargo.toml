[package]
name = "mythos-discovery"
# A module has its own version (ADR-011 §2.6): it is released and replaced on its own,
# and the server says which version of it runs. Bump it when the module changes.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "MythOS discovery: announce this node and find others on the network over mDNS (ADR-012 §2.2)"

[lints]
workspace = true

[dependencies]
mythos-module.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
mdns-sd = "0.21"

[[bin]]
name = "mythos-module-discovery"
path = "src/bin/mythos-module-discovery.rs"
