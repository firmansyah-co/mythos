[package]
name = "mythos-hmi"
# A module has its own version (ADR-011 §2.6): it is released and replaced on its own,
# and the server says which version of it runs. Bump it when the module changes.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The MythOS HMI: screens, faceplates and the operator runtime, as a service module (ADR-011)"

[lints]
workspace = true

[dependencies]
mythos-module.workspace = true
async-trait.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "mythos-module-hmi"
path = "src/bin/mythos-module-hmi.rs"
