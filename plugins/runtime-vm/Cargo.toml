[package]
name = "mythos-runtime-vm"
# A module has its own version (ADR-011 §2.6): it is released and replaced on its own,
# and the server says which version of it runs. Bump it when the module changes.
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The MythOS logic runtime for a PC: runs compiled IEC 61131-3 programs on the logic VM, as a runtime module (ADR-013)"

[lints]
workspace = true

# A module depends on the protocol, never on the core (ADR-011 §2.6). The VM is a library with
# no dependency of its own.
[dependencies]
mythos-plugin-sdk = { path = "../../crates/mythos-plugin-sdk" }
mythos-module.workspace = true
mythos-logic-vm.workspace = true
async-trait.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[[bin]]
name = "mythos-module-runtime-vm"
path = "src/bin/mythos-module-runtime-vm.rs"

# The tests compile Structured Text into the programs they run.
[dev-dependencies]
mythos-logic-compiler.workspace = true
