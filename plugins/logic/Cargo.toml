[package]
name = "mythos-logic"
# A module has its own version (ADR-011 §2.6): it is released and replaced on its own,
# and the server says which version of it runs. Bump it when the module changes.
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "MythOS control logic authoring: programs, their bindings to tags, check and build, as a service module (ADR-013)"

[lints]
workspace = true

# A module depends on the protocol, never on the core or another module (ADR-011 §2.6). The
# compiler is a library.
[dependencies]
mythos-module.workspace = true
mythos-logic-compiler.workspace = true
mythos-logic-st.workspace = true
async-trait.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }

[[bin]]
name = "mythos-module-logic"
path = "src/bin/mythos-module-logic.rs"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
# Only to pin the two copies of the file rule together (a test): dev-dependencies do not
# count as a module depending on another (module_boundaries.rs).
mythos-data = { path = "../data" }
