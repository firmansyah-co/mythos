[package]
name = "mythos-data"
# A module has its own version (ADR-011 §2.6): it is released and replaced on its own,
# and the server says which version of it runs. Bump it when the module changes.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "MythOS user types and data blocks of a project: stored, checked with the compiler, laid out, as a service module (ADR-014)"

[lints]
workspace = true

# A module depends on the protocol, never on the core or another module (ADR-011 §2.6). The
# compiler and the Structured Text front-end are libraries.
[dependencies]
mythos-module.workspace = true
mythos-logic-compiler.workspace = true
mythos-logic-st.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[bin]]
name = "mythos-module-data"
path = "src/bin/mythos-module-data.rs"
