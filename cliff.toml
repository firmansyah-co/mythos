# ==============================================================================
# git-cliff ~ MythOS Changelog & Conventional Commit Configuration
# SemVer format: A.B.C-dev.<delta> (dev), A.B.C-rc.<iter> (rc), A.B.C (release)
# Optional PR build metadata: A.B.C-dev.<delta>+pr<id>
# ==============================================================================

[changelog]
header = """
# Changelog

All notable changes to MythOS are documented here.
Format adheres strictly to Conventional Commits and SemVer 2.0.0 pre-release specifications.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  # Replace issue numbers with markdown links if desired
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous Tasks" },
  { message = "^ci", group = "<!-- 8 -->Continuous Integration" },
  { message = "^style", group = "<!-- 9 -->Styling & Lint" },
  { body = ".*security", group = "<!-- 10 -->Security" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "beta|alpha"
ignore_tags = ""
sort_commits = "oldest"
