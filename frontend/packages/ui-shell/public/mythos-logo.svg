<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080b11"/>
    </radialGradient>

    <!-- Logo Gradient: Electric Amber to Vivid Rust -->
    <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Logo Gradient: Cyan Pulse Accent -->
    <linearGradient id="logo-grad-secondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg-glow)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1">
    <path d="M 0 32 L 128 32 M 0 64 L 128 64 M 0 96 L 128 96"/>
    <path d="M 32 0 L 32 128 M 64 0 L 64 128 M 96 0 L 96 128"/>
  </g>

  <!-- Centered Composition -->
  <g transform="translate(64, 64)">
    <!-- Ambient Halo Glow behind Logo -->
    <circle cx="0" cy="0" r="42" fill="#f97316" opacity="0.12" filter="url(#core-glow)"/>
    <circle cx="0" cy="0" r="24" fill="#38bdf8" opacity="0.10" filter="url(#core-glow)"/>

    <!-- MINIMALIST GEOMETRIC ICON: PRECISION CRUCIBLE "M" -->
    <g transform="translate(-40, -42) scale(0.80)">
      <!-- Left Pylon -->
      <path d="M 12 100 L 12 24 L 38 48 L 38 100 Z" fill="url(#logo-grad-primary)"/>
      
      <!-- Right Pylon -->
      <path d="M 88 100 L 88 24 L 62 48 L 62 100 Z" fill="url(#logo-grad-primary)"/>

      <!-- Center Dynamic Chevron / Core Node -->
      <path d="M 50 16 L 72 38 L 50 60 L 28 38 Z" fill="url(#logo-grad-secondary)" filter="url(#core-glow)"/>
      <path d="M 50 24 L 64 38 L 50 52 L 36 38 Z" fill="#ffffff" opacity="0.95"/>
    </g>
  </g>
</svg>
