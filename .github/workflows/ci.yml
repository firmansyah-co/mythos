name: MythOS Continuous Integration

on:
  push:
    branches:
      - dev
      - rc
      - release
  # No `branches` filter: a pull_request trigger that lists base branches runs no
  # workflow at all for a PR opened against any other base (a stacked PR shows an
  # empty check list, not a failing one), so review verdicts were being issued on
  # code nothing had ever compiled. dev/rc/release remain gated by the push filter
  # above plus their required status checks with strict=true, so merged content is
  # still gated at the branch boundary; this only closes the PR-review blind spot.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A PUSH TO dev DOES NOT RUN THE SUITE AGAIN ON A TREE ITS PULL REQUEST ALREADY PASSED.
  #
  # dev requires its checks on a branch that is up to date with it, so the pull request run and
  # the push run that follows the merge tested the same tree: over the 100 runs measured on
  # 2026-11-16, 15 of the 37 CI runs were that repeat, and all eight merges checked by hand had
  # the tree of their pull request's head. The repeat also took the shared runner from the next
  # pull request, and two full suites at once is what makes the SHM latency gate miss its bound.
  #
  # scripts/ci-already-verified.sh establishes it from GitHub for this very commit (same tree,
  # head contained dev, a passed run of that head) and answers false for anything else, so a
  # direct push or a merge of a branch that was behind still gets the whole suite. On a pull
  # request, and on rc and release, this job does not run and the suites always do.
  #
  # It runs on a hosted runner so that deciding to do nothing does not start a runner here.
  # `!cancelled()` on the suites: if this job cannot run or fails, they run.
  already-verified:
    name: Was this tree already verified on its pull request?
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Ask GitHub what was tested
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-already-verified.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" ci.yml

  core-engine-tests:
    name: Rust Workspace Test Suite & Lints
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: arc-runner-org
    env:
      RUSTUP_HOME: /opt/hostedtoolcache/rustup
      CARGO_HOME: /opt/hostedtoolcache/cargo
      CARGO_HTTP_IP_RESOLVE: "ipv4"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
      RUSTC_WRAPPER: "/opt/hostedtoolcache/cargo/bin/sccache"
      SCCACHE_DIR: "/opt/hostedtoolcache/sccache"
      SCCACHE_CACHE_SIZE: "10G"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # THE RUNNER IMAGE CARRIES THESE PACKAGES; THIS STEP IS THE FALLBACK.
      #
      # On the stock runner image this step installed 348 packages on every run (a median 86 s of
      # this job over 36 runs on 2026-11-16; nothing was downloaded, the time is dpkg). The scale
      # set now starts from the image built in ci/runner, which has them, so the check below finds
      # them and installs nothing.
      #
      # The list is ci/runner/packages.txt, read both here and by the image's Dockerfile. A package
      # added there is installed by apt in each run until the image is next rebuilt (weekly, or by
      # hand: ci/runner/README.md), so a run is never wrong, only slower. The step's own line in the
      # job summary says which of the two happened.
      - name: Install Build Tools & Linker
        run: |
          START=$(date +%s)
          # Serialize every apt run. All jobs on this self-hosted runner share the
          # persistent cache at /opt/hostedtoolcache/apt, and concurrent runs raced it:
          # one left a stale archives/lock and every later run died with
          # "E: Could not get lock ... It is held by process 0" (exit 100).
          sudo mkdir -p /opt/hostedtoolcache/apt
          exec 9>/opt/hostedtoolcache/apt/.mythos-apt.lock
          flock 9

          # Only now that we hold the serialization lock is it safe to clear stale
          # locks: removing them outside it could corrupt an apt run that holds one.
          sudo rm -f /opt/hostedtoolcache/apt/archives/lock /opt/hostedtoolcache/apt/lists/lock

          # Disable docker-clean so downloaded .deb packages are preserved
          sudo rm -f /etc/apt/apt.conf.d/docker-clean 2>/dev/null || true

          # Create persistent cache directories on host-backed toolcache
          sudo mkdir -p /opt/hostedtoolcache/apt/archives/partial
          sudo mkdir -p /opt/hostedtoolcache/apt/lists/partial
          sudo chmod -R 777 /opt/hostedtoolcache/apt 2>/dev/null || true

          # Configure APT via /etc/apt/apt.conf.d/99custom-cache
          cat << 'EOF' | sudo tee /etc/apt/apt.conf.d/99custom-cache >/dev/null
          Dir::Cache::Archives "/opt/hostedtoolcache/apt/archives";
          Dir::State::Lists "/opt/hostedtoolcache/apt/lists";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          APT::Keep-Downloaded-Packages "true";
          EOF

          PKGS="$(tr '\n' ' ' < ci/runner/packages.txt)"

          if dpkg -s $PKGS >/dev/null 2>&1; then
            echo "All required build tools and linker packages are already installed, skipping."
            MODE="already present in the runner image"
          else
            MODE="installed by apt in this run (dpkg configure only; 0 downloads from cache)"
            # Check if package lists need update (if lists are missing or older than 24 hours)
            if [ -z "$(find /opt/hostedtoolcache/apt/lists -maxdepth 1 -type f -name '*_Packages' -mtime -1 2>/dev/null)" ]; then
              echo "Package lists missing or older than 24h. Updating package lists..."
              sudo apt-get update -y
            else
              echo "Reusing cached package lists."
            fi
            echo "Installing required packages..."
            sudo apt-get install -y --no-install-recommends $PKGS
          fi

          SECS=$(( $(date +%s) - START ))
          echo "build tools: $MODE in ${SECS}s"
          {
            echo "### Rust job timing"
            echo ""
            echo "| phase | seconds |"
            echo "|---|---|"
            echo "| build tools / linker | $SECS |"
            echo ""
            echo "- build tool mode: $MODE"
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Setup Cache Symlinks and Directories
        run: |
          sudo mkdir -p /opt/hostedtoolcache/rustup /opt/hostedtoolcache/cargo/bin /opt/hostedtoolcache/sccache
          sudo chown -R $(id -u):$(id -g) /opt/hostedtoolcache/rustup /opt/hostedtoolcache/cargo /opt/hostedtoolcache/sccache 2>/dev/null || true
          sudo chmod -R 777 /opt/hostedtoolcache/sccache 2>/dev/null || true
          if [ -d "/home/runner/.cargo/registry" ]; then
            ln -s /home/runner/.cargo/registry /opt/hostedtoolcache/cargo/registry 2>/dev/null || true
          fi
          if [ -d "/home/runner/.cargo/git" ]; then
            ln -s /home/runner/.cargo/git /opt/hostedtoolcache/cargo/git 2>/dev/null || true
          fi
          echo "/opt/hostedtoolcache/cargo/bin" >> $GITHUB_PATH

      - name: Install & Start sccache Server
        run: |
          if [ ! -x "/opt/hostedtoolcache/cargo/bin/sccache" ]; then
            echo "Installing sccache v0.8.2..."
            curl -fsSL https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz -o /tmp/sccache.tar.gz
            tar -xzf /tmp/sccache.tar.gz -C /tmp
            mv /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /opt/hostedtoolcache/cargo/bin/sccache
            chmod +x /opt/hostedtoolcache/cargo/bin/sccache
            rm -rf /tmp/sccache*
          else
            echo "sccache already present in toolcache, skipping download."
          fi
          /opt/hostedtoolcache/cargo/bin/sccache --version
          /opt/hostedtoolcache/cargo/bin/sccache --start-server || true
          /opt/hostedtoolcache/cargo/bin/sccache --zero-stats || true

      - name: Install Rust Toolchain
        run: |
          export PATH="/opt/hostedtoolcache/cargo/bin:$PATH"
          export RUSTC_WRAPPER="/opt/hostedtoolcache/cargo/bin/sccache"
          if command -v rustc >/dev/null 2>&1 && command -v cargo >/dev/null 2>&1 && rustup component list | grep -q "rustfmt.*(installed)" && rustup component list | grep -q "clippy.*(installed)"; then
            echo "Rust toolchain already present in cache, skipping re-download."
          else
            echo "Installing or updating Rust toolchain via rustup..."
            for i in 1 2 3 4 5; do
              echo "Attempt $i to install rustup..."
              curl --proto '=https' --tlsv1.2 --retry 5 --retry-delay 2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt,clippy && break || sleep 5
            done
          fi
          if [ -f "/opt/hostedtoolcache/cargo/env" ]; then
            source /opt/hostedtoolcache/cargo/env
          fi
          rustc --version
          cargo --version

      - name: Cargo Format Check
        run: |
          export PATH="/opt/hostedtoolcache/cargo/bin:$PATH"
          if [ -f "/opt/hostedtoolcache/cargo/env" ]; then
            source /opt/hostedtoolcache/cargo/env
          fi
          cargo fmt --all -- --check

      - name: Cargo Clippy Audit
        run: |
          export PATH="/opt/hostedtoolcache/cargo/bin:$PATH"
          if [ -f "/opt/hostedtoolcache/cargo/env" ]; then
            source /opt/hostedtoolcache/cargo/env
          fi
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run All Workspace Tests
        run: |
          export PATH="/opt/hostedtoolcache/cargo/bin:$PATH"
          if [ -f "/opt/hostedtoolcache/cargo/env" ]; then
            source /opt/hostedtoolcache/cargo/env
          fi
          cargo test --workspace --verbose

      # TSK-002's "< 300 ns atomic swap" target (50 ns until the owner raised it on 2026-11-17)
      # is asserted here on the release build, because
      # release has ~3x headroom rather than ~1.6x and degrades much less when the runner is
      # loaded. Debug is not incapable of meeting the bound (it measures 26-32 ns at true idle),
      # but this runner shares its cores with the agent fleet and its load swings from 1.2 to
      # 200+, so the larger margin is what makes the gate stable. The debug run above therefore
      # only smoke-checks the hot path; the acceptance assertion is gated on this release run.
      # See the header of crates/mythos-shm/tests/shm_engine_tests.rs for the measurement regime,
      # the recorded distributions with their load conditions, and the local-runner fact.
      - name: Run SHM Atomic Swap Latency Gate (release)
        run: |
          export PATH="/opt/hostedtoolcache/cargo/bin:$PATH"
          if [ -f "/opt/hostedtoolcache/cargo/env" ]; then
            source /opt/hostedtoolcache/cargo/env
          fi
          cargo test --release -p mythos-shm --test shm_engine_tests -- --nocapture

      # TSK-010's criterion is "< 100 ns p99 read/write under 16 concurrent threads". Nothing
      # computed a p99 until shm_p99_report.rs; the criterion suite below was only ever compiled
      # (--no-run), so TSK-010 had never actually been measured. Both now run:
      #   - shm_p99_report: real per-operation p99, 1 writer + 15 readers on a live SHM segment.
      #   - the criterion suite: executed with reduced sampling so it fits the job budget, and
      #     archived so the numbers are inspectable rather than guessed.
      #
      # REPORT, NOT A GATE. This step previously read "Run SHM p99 Concurrency Gate", which was
      # green while its own log printed "TSK-010 VERDICT: ... NOT MET" (measured p99 ~1.2-1.3 us
      # against a 100 ns target). It asserts only a gross-breakage backstop (p50 at 10x the p50 of
      # the runs that bound was derived from), so its name must not claim the criterion passed.
      # Whether `p99 < 100 ns` should be enforced is a board scope decision, not a CI threshold;
      # the number is reported and logged on every run.
      #
      # MYTHOS_TSK010_OUT makes the retained-distribution path explicit here rather than leaving CI
      # to rely on the test's own workspace-root derivation.
      - name: Report SHM p99 under 16 threads (TSK-010 report + breakage backstop)
        env:
          MYTHOS_TSK010_OUT: ${{ github.workspace }}/target/tsk010-p99
        run: |
          export PATH="/opt/hostedtoolcache/cargo/bin:$PATH"
          if [ -f "/opt/hostedtoolcache/cargo/env" ]; then
            source /opt/hostedtoolcache/cargo/env
          fi
          cargo test --release -p mythos-shm --test shm_p99_report -- --nocapture

      # NOTE ON THE STEP NAME: it reads "report + breakage backstop", not "non-gating". The CRITERION
      # is not gated (p99 < 100 ns is reported, never asserted), but the step CAN fail the job — on a
      # gross-breakage backstop or on a starved population (a harness failure). The earlier
      # "non-gating" wording was written before this step could fail and would understate it.
      #
      # RETAIN EACH RUN'S DISTRIBUTION. The board's decision is to write no bound until five or more
      # runs exist; that is only possible if the runs are kept from now on. The three runs the
      # current backstops were derived from had to be read out of CI logs by hand, and hand-read
      # numbers are not a baseline. This artifact is what makes the fifth run a series rather than
      # another log line.
      #
      # NON-BLOCKING for the same reason as the benchmark archive below: retaining numbers cannot
      # tell anyone whether the code is correct, so it must not be able to fail the job (#35).
      # `if: always()` so a run that failed its backstop still retains the numbers that show why.
      - name: Archive TSK-010 p99 distributions
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tsk010-p99-distributions
          path: target/tsk010-p99
          retention-days: 90
          if-no-files-found: warn

      - name: Run SHM Micro-Benchmark (criterion, executed)
        run: |
          export PATH="/opt/hostedtoolcache/cargo/bin:$PATH"
          if [ -f "/opt/hostedtoolcache/cargo/env" ]; then
            source /opt/hostedtoolcache/cargo/env
          fi
          cargo bench -p mythos-shm --bench shm_bench -- \
            --sample-size 10 --measurement-time 1 --warm-up-time 1 --noplot

      # NON-BLOCKING, deliberately. Archival preserves the criterion numbers for later
      # inspection; it cannot tell anyone whether the code is correct, so it must not be able to
      # fail the job. It did: on PR #20 (run 40271532287) the upload succeeded — "Uploaded bytes
      # 6146", "Finished uploading artifact content to blob storage" — and the step then failed at
      # finalize after 5 attempts, `getaddrinfo EAI_AGAIN results-receiver.actions.githubusercontent.com`,
      # which reddened the required check for a build whose tests and benchmark had all passed.
      #
      # `if: always()` is kept so the step still runs and still archives whenever the upload path
      # is healthy; `continue-on-error` makes its outcome advisory. This matches `Display sccache
      # Statistics` below, which was already written defensively with `|| true` — the asymmetry
      # between the two is what let this through.
      - name: Archive SHM Benchmark Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shm-criterion-results
          path: target/criterion
          retention-days: 14
          if-no-files-found: warn

      - name: Display sccache Statistics
        if: always()
        run: |
          /opt/hostedtoolcache/cargo/bin/sccache --show-stats || true

  # MythOS must run on Windows and macOS as well as Linux. Until this job existed nothing had ever
  # compiled it there, and it did not compile: the Windows shared memory called a windows-sys API
  # that no longer existed, and every POSIX call was compiled on every platform. Lints and the
  # whole test suite run here, on GitHub's hosted runners (the self-hosted runner is Linux only).
  # The repository is public, so these runners cost nothing.
  #
  # The release latency gate and the p99 report stay on the Linux job: they describe that runner,
  # and a shared hosted VM says nothing about it. `cargo test` here runs only the debug smoke check
  # (a 250 ns best-batch backstop against a lock or syscall on the hot path).
  cross-platform-tests:
    name: Rust Workspace on ${{ matrix.os }}
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not hide what the other says.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2

      - name: Cargo Clippy Audit
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --no-fail-fast: a failure in one test binary must not hide what the others say.
      # MYTHOS_TEST_MDNS: two discovery modules hear each other over multicast (ADR-012 §2.2),
      # which these hosted runners have; a container may not, so elsewhere that test says SKIP.
      - name: Run All Workspace Tests
        env:
          MYTHOS_TEST_MDNS: "1"
        run: cargo test --workspace --no-fail-fast

      # ADR-012 step 2: `mythos service install` installs mythos-server as a real service of the
      # runner's operating system (Task Scheduler as SYSTEM on Windows; launchd as root through
      # passwordless sudo on macOS), checks it answers, uninstalls it and checks it stopped. A
      # developer's machine never runs this: the test is ignored without MYTHOS_TEST_SERVICE=1.
      - name: Install mythos-server as a real service, then remove it
        env:
          MYTHOS_TEST_SERVICE: "1"
        run: cargo test -p mythos-cli --test service_roundtrip -- --ignored --nocapture

  # ADR-013: the logic VM's core must run on microcontrollers (ESP32, RP2040) as well as in the
  # PC runner. This links it into bare-metal firmware for both, with `core` alone, from the first
  # PR on, so nothing can make it need `std` or an allocator without this job going red. It
  # prints the flash it costs, then runs real programs on the VM in emulators of both
  # instruction sets. A hosted runner: it is a cross build, not a measurement of a host.
  logic-vm-bare-metal:
    name: Logic VM on Bare Metal (RP2040, ESP32-C3)
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
          components: llvm-tools

      # `shell: bash` is what gives these steps `pipefail`: without it GitHub runs `bash -e`,
      # and a script that fails into `| tee` leaves the step green.
      - name: Link the VM into firmware and print its size
        shell: bash
        run: scripts/logic-vm-footprint.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm
          # The RISC-V emulators are in qemu-system-riscv on newer Ubuntu and in
          # qemu-system-misc on older ones.
          sudo apt-get install -y -qq --no-install-recommends qemu-system-riscv \
            || sudo apt-get install -y -qq --no-install-recommends qemu-system-misc
          qemu-system-arm --version | head -n 1
          qemu-system-riscv32 --version | head -n 1

      # The same programs, on the VM, inside an emulated Cortex-M0 (the RP2040's instruction
      # set) and an emulated RV32IMC machine (the ESP32-C3's): every scan must leave the VM's
      # memory byte for byte as it is on this machine.
      - name: Run programs on emulated microcontrollers and compare with this machine
        shell: bash
        run: scripts/logic-vm-on-emulators.sh | tee -a "$GITHUB_STEP_SUMMARY"

  frontend-tests:
    name: Frontend Web Workbench Test Suite & Lints
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: arc-runner-org
    # Clean-tree build measured ~8.5 min (ui-logic-editor alone is ~6.5 min).
    # Without this, a hang would run to GitHub's 6h default.
    timeout-minutes: 30
    env:
      PNPM_VERSION: "12.14.0"
      PNPM_PREFIX: /opt/hostedtoolcache/pnpm/12.14.0
      PNPM_STORE: /opt/hostedtoolcache/pnpm-store
    defaults:
      run:
        # frontend/ is the pnpm workspace root (pnpm-workspace.yaml + pnpm-lock.yaml live here).
        # Top-level packages/ and plugins/ entries without a package.json are ignored by pnpm.
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # npm's own cache goes to a job-local directory; it is unrelated to pnpm's store below.
      - name: Configure npm cache directory
        shell: bash
        run: echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned: no .nvmrc and no engines field. Vite 6 needs >=18; @types/node is ^22.
          # MUST run before pnpm is installed: arc-runner-org is self-hosted and has no
          # node on PATH, so pnpm/action-setup's self-installer dies with
          # "sh: 1: node: not found". For the same reason `cache: pnpm` cannot be used
          # here (setup-node shells out to a pnpm that does not exist yet).
          node-version: '22'

      # PNPM AND ITS STORE STAY ON THE RUNNER, IN THE HOST-BACKED TOOL CACHE.
      #
      # Measured over 38 green runs of this job on 2026-11-16 (median 3.6 min): 56 s restoring the
      # store through actions/cache (324 MB fetched from GitHub on every run, 125 s at worst) and
      # 18 s installing pnpm with npm, every time. /opt/hostedtoolcache is a host directory that
      # outlives the runner pod: it is where the Rust job keeps rustup and sccache.
      #
      # WHY THE STORE WAS NOT ALREADY THERE: pnpm keeps its store on the file system of the
      # project unless told otherwise, so in the pod it used /home/runner/.pnpm-store, which dies
      # with the pod. `--store-dir` on the install is what places it; an environment variable does
      # not (measured earlier in this file's history).
      #
      # Nothing here can let a wrong dependency in: `--frozen-lockfile` still fails the install
      # when pnpm-lock.yaml disagrees with package.json, and pnpm verifies the content of what it
      # takes from the store (verify-store-integrity, on by default). An empty store only means a
      # slower run. The store is as trusted as the rest of this tool cache: the Rust job already
      # runs the sccache and the toolchain kept beside it.
      - name: Install pnpm
        run: |
          # Pinned: frontend/package.json has no packageManager field, so nothing would
          # otherwise select a version. This matches the version that generated pnpm-lock.yaml.
          START=$(date +%s)
          sudo mkdir -p "$PNPM_PREFIX" "$PNPM_STORE"
          sudo chown "$(id -u):$(id -g)" "$PNPM_PREFIX" "$PNPM_STORE"
          # Two jobs may get here at once the first time; one installs, the other waits.
          exec 9>"$PNPM_PREFIX/.install.lock"
          flock 9
          if [ "$("$PNPM_PREFIX/bin/pnpm" --version 2>/dev/null)" = "$PNPM_VERSION" ]; then
            MODE="already in the tool cache"
          else
            MODE="installed by npm in this run"
            npm install --global --prefix "$PNPM_PREFIX" "pnpm@$PNPM_VERSION"
          fi
          flock -u 9
          echo "$PNPM_PREFIX/bin" >> "$GITHUB_PATH"
          "$PNPM_PREFIX/bin/pnpm" --version
          echo "pnpm $PNPM_VERSION: $MODE"
          { echo "| pnpm ($MODE) | $(( $(date +%s) - START )) |"; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify Toolchain Versions
        run: |
          # Proof in the run log that the pinned versions above are what actually ran.
          node --version
          pnpm --version

      # REQ 2 — SUPPLY-CHAIN VERIFICATION STAYS ON, IN THE REQUIRED JOB.
      # `--frozen-lockfile` is not negotiable and is not cached away: it is what makes the install
      # fail closed when pnpm-lock.yaml disagrees with package.json, and it runs in this job, which
      # is a required context on dev. The store moving to host storage changes only where
      # content-addressed tarballs live; the lockfile check itself still executes on every run.
      - name: Install Dependencies
        run: |
          START=$(date +%s)
          STATUS=0
          BEFORE=$(find "$PNPM_STORE" -type f 2>/dev/null | wc -l | tr -d ' ')
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE" || STATUS=$?
          AFTER=$(find "$PNPM_STORE" -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "pnpm store $PNPM_STORE: $BEFORE files before the install, $AFTER after"
          { echo "| install dependencies (--frozen-lockfile; store files $BEFORE -> $AFTER) | $(( $(date +%s) - START )) |"; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Resolve Build Channel
        run: |
          # The channel the bundle belongs to, derived from the event that produced it
          # (dev/rc/release branch, tag suffix, or unknown for a PR preview or local build).
          # VITE_APP_CHANNEL is read by src/lib/appVersion.ts and rendered in the status bar.
          # Never defaulted: scripts/version.sh prints `unknown` when it cannot establish one,
          # because a defaulted channel is a fabricated measurement.
          CHANNEL="$(../scripts/version.sh --channel)"
          echo "Resolved build channel: ${CHANNEL}"
          echo "VITE_APP_CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"

      - name: Typecheck & Lint
        run: |
          START=$(date +%s)
          STATUS=0
          pnpm lint || STATUS=$?
          { echo "| typecheck + lint | $(( $(date +%s) - START )) |"; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Run Frontend Test Suite
        run: |
          START=$(date +%s)
          STATUS=0
          pnpm test || STATUS=$?
          { echo "| frontend tests | $(( $(date +%s) - START )) |"; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Build Frontend Bundles
        run: |
          START=$(date +%s)
          STATUS=0
          pnpm build || STATUS=$?
          { echo "| frontend build | $(( $(date +%s) - START )) |"; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS
