name: MythOS Continuous Integration

on:
  push:
    branches:
      - dev
      - rc
      - release
  pull_request:
    branches:
      - dev
      - rc
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-engine-tests:
    name: Rust Workspace Test Suite & Lints
    runs-on: arc-runner-org
    env:
      RUSTUP_HOME: /tmp/rustup
      CARGO_HOME: /tmp/cargo
      CARGO_HTTP_IP_RESOLVE: "ipv4"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools & Linker
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential gcc libc6-dev pkg-config libdbus-1-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Setup Cache Symlinks and Directories
        run: |
          mkdir -p /tmp/rustup /tmp/cargo/bin
          if [ -d "/home/runner/.cargo/registry" ]; then
            ln -s /home/runner/.cargo/registry /tmp/cargo/registry 2>/dev/null || true
          fi
          if [ -d "/home/runner/.cargo/git" ]; then
            ln -s /home/runner/.cargo/git /tmp/cargo/git 2>/dev/null || true
          fi
          echo "/tmp/cargo/bin" >> $GITHUB_PATH

      - name: Install Rust Toolchain
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i to install rustup..."
            curl --proto '=https' --tlsv1.2 --retry 5 --retry-delay 2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt,clippy && break || sleep 5
          done
          source /tmp/cargo/env
          rustc --version
          cargo --version

      - name: Cargo Format Check
        run: |
          source /tmp/cargo/env
          cargo fmt --all -- --check

      - name: Cargo Clippy Audit
        run: |
          source /tmp/cargo/env
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run All Workspace Tests
        run: |
          source /tmp/cargo/env
          cargo test --workspace --verbose

      - name: Run SHM Micro-Benchmark Check
        run: |
          source /tmp/cargo/env
          cargo bench -p mythos-shm --no-run
