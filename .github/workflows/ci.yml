name: MythOS Continuous Integration

on:
  push:
    branches:
      - dev
      - rc
      - release
  # No `branches` filter: a pull_request trigger that lists base branches runs no
  # workflow at all for a PR opened against any other base (a stacked PR shows an
  # empty check list, not a failing one), so review verdicts were being issued on
  # code nothing had ever compiled. dev/rc/release remain gated by the push filter
  # above plus their required status checks (on dev through its merge queue, below; on rc and
  # release on a branch that is up to date), so merged content is still gated at the branch
  # boundary; this only closes the PR-review blind spot.
  pull_request:
  # THE MERGE QUEUE OF dev (the owner's decision, 2026-11-22).
  #
  # Until then dev required its checks on a branch that was up to date with it: of several pull
  # requests open at once only one could merge, and each of the others had to be rebased and
  # wait for the whole suite again, once for every merge ahead of it. With the queue a pull
  # request that passed its checks is put on top of dev and of whatever is ahead of it in the
  # queue, GitHub runs this workflow on that commit (the `merge_group` event), and dev moves to
  # it when the required checks pass. Nobody rebases, and what lands was tested as it lands.
  #
  # Without this trigger the queue would wait for checks that never come.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE SUITE DOES NOT RUN AGAIN ON A TREE ITS PULL REQUEST ALREADY PASSED.
  #
  # In the merge queue: a pull request that contained everything ahead of it (dev did not move,
  # and nothing is before it in the queue) gets a commit with the very tree its own run tested.
  # The suites are skipped for it, a skipped required check counts as passed, and the queue
  # merges it at once: a pull request alone is not tested twice. When dev moved or another pull
  # request is ahead, the tree is a new one and the whole suite runs on it.
  #
  # On a push to dev: the push that follows a merge is the commit the queue tested, or a tree
  # its pull request tested. Over the 100 runs measured on 2026-11-16, 15 of the 37 CI runs
  # were that repeat, and all eight merges checked by hand had the tree of their pull request's
  # head.
  #
  # scripts/ci-already-verified.sh establishes it from GitHub for this very commit (same tree,
  # head contained what it was put on, a passed run of that head; or, on dev, a passed run of
  # the queue for this commit) and answers false for anything else, so a direct push or a pull
  # request that was behind still gets the whole suite. On a pull request, and on rc and
  # release, this job does not run and the suites always do.
  #
  # It runs on a hosted runner so that deciding to do nothing does not start a runner here.
  # `!cancelled()` on the suites: if this job cannot run or fails, they run.
  already-verified:
    name: Was this tree already verified on its pull request?
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Ask GitHub what was tested
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # The ref of the merge group in the queue; empty on a push.
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: ./scripts/ci-already-verified.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" ci.yml "$QUEUE_REF"

  # THE LINUX SUITE RUNS ON GITHUB'S HOSTED RUNNER (the owner's decision, 2026-11-22).
  #
  # It ran on the self-hosted runner, a machine it shares with the builds of whoever is working
  # on it. On 2026-11-22 that machine's load average was 40 to 80 while pull requests were
  # built, this job took 17 and 24 minutes in two runs where the same lints and tests took 7.5
  # to 9 minutes on macos-latest and 10 to 12 on windows-latest, and four runs went red on tests
  # that passed alone (a module swap that timed out, a watch read too early, twice a 5 s test
  # timeout). A hosted runner is a machine of its own for each job, several pull requests run at
  # once instead of queueing for two runners, and the repository is public, so it costs nothing.
  #
  # The release latency tests and the benchmark of the shared memory engine are a job of their
  # own, `shm-latency-report` below, which reports and holds nothing. `cargo test` here runs only
  # the debug smoke check of the SHM hot path, as on Windows and macOS.
  #
  # The name is a required status check of dev, rc and release: it must not change.
  core-engine-tests:
    name: Rust Workspace Test Suite & Lints
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The list the self-hosted runner's image is built from (ci/runner/packages.txt): what the
      # desktop host links against.
      - name: Install Build Tools & Linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends $(tr '\n' ' ' < ci/runner/packages.txt)

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Restored from the cache `cargo-cache` below keeps for dev; a pull request saves none.
      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: suite
          save-if: ${{ github.event_name == 'push' }}

      - name: Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy Audit
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --no-fail-fast: a failure in one test binary must not hide what the others say.
      - name: Run All Workspace Tests
        run: cargo test --workspace --no-fail-fast

  # THE CARGO CACHE IS KEPT BY dev, AND PULL REQUESTS ONLY READ IT.
  #
  # Measured on the pull request run 45021219674 (2026-11-22): the Linux suite found no cache at
  # all and built every dependency; Windows and macOS restored an old one that did not match,
  # and then spent 173 s and 66 s saving a new one after the tests, time the required check
  # waits for. A cache saved by a pull request can be read by that pull request alone, each is
  # about 1 GB for each system, and the repository may keep 10 GB: they pushed each other out.
  # No run on dev saved one, because a push to dev does not run the suites again (above).
  #
  # So this job, on every push to dev, on each system: if there is no cache for this Cargo.lock
  # and these manifests, it builds what the suites build (the lints and the test binaries, not
  # run) and saves the dependencies. dev is the default branch, so every pull request and every
  # entry of the merge queue can read it. The suites save nothing on a pull request or in the
  # queue (`save-if`), under the same `shared-key`.
  #
  # It holds no branch and is not a required check. If it fails, the suites are slower.
  # What it saves a pull request is NOT MEASURED until one has run after it.
  cargo-cache:
    name: Cargo Cache of dev on ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools & Linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends $(tr '\n' ' ' < ci/runner/packages.txt)

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore the cache, and save it at the end if there was none for these manifests
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: suite

      - name: Build what the suites build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clippy --workspace --all-targets
          cargo test --workspace --no-run

  # THE SHM LATENCY NUMBERS ARE REPORTED HERE, NOT ENFORCED (the owner's decision, 2026-11-22).
  #
  # Until then the release run of shm_engine_tests asserted the 300 ns swap bound of TSK-002 and
  # the 300 ns read bound of NFR-001 and SYS-REQ-002 inside the required Linux job, on the
  # self-hosted runner. This job runs the same tests on a hosted runner, and a miss is a warning
  # on the run, never a red check: no branch waits for this job, and it is not a required status
  # check. So nothing in CI holds those bounds any more. A regression of the hot path shows as a
  # warning here, and somebody has to read it.
  #
  # A hosted runner is a shared VM: its timing says little about a controller's hardware (the
  # header of crates/mythos-shm/tests/shm_engine_tests.rs has the regime and the distributions
  # measured on the self-hosted machine), which is the other reason a miss here cannot be a
  # verdict. The debug smoke check of the hot path (a 250 ns best-batch backstop against a lock
  # or a syscall) still runs in every suite and still fails it.
  shm-latency-report:
    name: SHM Latency Report (not enforced)
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # A release build, so a cache of its own; a pull request saves none (see `cargo-cache`).
      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      # TSK-002's "< 300 ns atomic swap" (50 ns until the owner raised it on 2026-11-17) and the
      # 300 ns tag read of NFR-001 and SYS-REQ-002 (the best of five rounds of 1,000,000 reads,
      # with zero corruption), on the release build: the acceptance assertions are compiled only
      # there. `continue-on-error`: the outcome is read by the last step and said as a warning.
      - name: Run SHM Swap and Read Latency Tests (release)
        id: latency
        continue-on-error: true
        run: cargo test --release -p mythos-shm --test shm_engine_tests -- --nocapture

      # TSK-010's criterion is "< 100 ns p99 read/write under 16 concurrent threads" (a read is
      # compared against the owner's 300 ns of NFR-001; a write still against 100 ns). This was
      # always a report: it asserts only a gross-breakage backstop and that its population was
      # not starved, and prints the measured p99 with its verdict against the criterion.
      #
      # MYTHOS_TSK010_OUT makes the retained-distribution path explicit here rather than leaving
      # CI to rely on the test's own workspace-root derivation.
      - name: Report SHM p99 under 16 threads (TSK-010 report + breakage backstop)
        id: p99
        continue-on-error: true
        env:
          MYTHOS_TSK010_OUT: ${{ github.workspace }}/target/tsk010-p99
        run: cargo test --release -p mythos-shm --test shm_p99_report -- --nocapture

      # Each run's distribution is kept: a series can only be read if the runs exist. Advisory,
      # as the benchmark archive below: retaining numbers cannot say whether the code is correct.
      - name: Archive TSK-010 p99 distributions
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tsk010-p99-distributions
          path: target/tsk010-p99
          retention-days: 90
          if-no-files-found: warn

      - name: Run SHM Micro-Benchmark (criterion, executed)
        id: bench
        continue-on-error: true
        run: |
          cargo bench -p mythos-shm --bench shm_bench -- \
            --sample-size 10 --measurement-time 1 --warm-up-time 1 --noplot

      - name: Archive SHM Benchmark Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shm-criterion-results
          path: target/criterion
          retention-days: 14
          if-no-files-found: warn

      # What the job is for: a miss is said where it is seen (an annotation on the run and a row
      # in its summary), and the job stays green, because it holds nothing.
      - name: Say what missed, as a warning
        if: always()
        shell: bash
        env:
          LATENCY: ${{ steps.latency.outcome }}
          P99: ${{ steps.p99.outcome }}
          BENCH: ${{ steps.bench.outcome }}
        run: |
          {
            echo "### SHM latency on a hosted runner (reported, not enforced)"
            echo ""
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| swap and read latency tests (release; TSK-002, NFR-001, SYS-REQ-002) | $LATENCY |"
            echo "| p99 under 16 threads (TSK-010 report + breakage backstop) | $P99 |"
            echo "| criterion micro-benchmark | $BENCH |"
            echo ""
            echo "A failure here does not fail the run and holds no branch. The numbers are in each step's log."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LATENCY" != "success" ]; then
            echo "::warning title=SHM latency tests: $LATENCY (not enforced)::The release run of shm_engine_tests did not pass on this hosted runner. It asserts the 300 ns swap and read bounds (TSK-002, NFR-001, SYS-REQ-002). Read the step's log: a shared VM can miss them under load, and so can a regression of the hot path."
          fi
          if [ "$P99" != "success" ]; then
            echo "::warning title=SHM p99 report: $P99 (not enforced)::shm_p99_report did not pass on this hosted runner (its breakage backstop, or a starved population). Read the step's log."
          fi
          if [ "$BENCH" != "success" ]; then
            echo "::warning title=SHM benchmark: $BENCH (not enforced)::The criterion benchmark did not run to its end on this hosted runner."
          fi

  # MythOS must run on Windows and macOS as well as Linux. Until this job existed nothing had ever
  # compiled it there, and it did not compile: the Windows shared memory called a windows-sys API
  # that no longer existed, and every POSIX call was compiled on every platform. Lints and the
  # whole test suite run here, on GitHub's hosted runners (the self-hosted runner is Linux only).
  # The repository is public, so these runners cost nothing.
  #
  # The release latency tests and the p99 report are `shm-latency-report` above, reported and not
  # enforced. `cargo test` here runs only the debug smoke check
  # (a 250 ns best-batch backstop against a lock or syscall on the hot path).
  # Two jobs, not one with a matrix: when the suites are skipped in the merge queue (above), a
  # job with a matrix reports its name unexpanded and the two required checks never report.
  # Their names are required status checks of dev: they must not change. The steps are in
  # .github/actions/rust-workspace-suite.
  windows-tests:
    name: Rust Workspace on windows-latest
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Lints, tests and the service
        uses: ./.github/actions/rust-workspace-suite

  macos-tests:
    name: Rust Workspace on macos-latest
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Lints, tests and the service
        uses: ./.github/actions/rust-workspace-suite

  # ADR-013: the logic VM's core must run on microcontrollers (ESP32, RP2040) as well as in the
  # PC runner. This links it into bare-metal firmware for both, with `core` alone, from the first
  # PR on, so nothing can make it need `std` or an allocator without this job going red. It
  # prints the flash it costs, then runs real programs on the VM in emulators of both
  # instruction sets. A hosted runner: it is a cross build, not a measurement of a host.
  logic-vm-bare-metal:
    name: Logic VM on Bare Metal (RP2040, ESP32-C3)
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf
          components: llvm-tools

      # `shell: bash` is what gives these steps `pipefail`: without it GitHub runs `bash -e`,
      # and a script that fails into `| tee` leaves the step green.
      - name: Link the VM into firmware and print its size
        shell: bash
        run: scripts/logic-vm-footprint.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm
          # The RISC-V emulators are in qemu-system-riscv on newer Ubuntu and in
          # qemu-system-misc on older ones.
          sudo apt-get install -y -qq --no-install-recommends qemu-system-riscv \
            || sudo apt-get install -y -qq --no-install-recommends qemu-system-misc
          qemu-system-arm --version | head -n 1
          qemu-system-riscv32 --version | head -n 1

      # The same programs, on the VM, inside an emulated Cortex-M0 (the RP2040's instruction
      # set) and an emulated RV32IMC machine (the ESP32-C3's): every scan must leave the VM's
      # memory byte for byte as it is on this machine.
      - name: Run programs on emulated microcontrollers and compare with this machine
        shell: bash
        run: scripts/logic-vm-on-emulators.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # On GitHub's hosted runner since 2026-11-22, with the Linux suite above and for its reasons.
  # The name is a required status check of dev and rc: it must not change.
  frontend-tests:
    name: Frontend Web Workbench Test Suite & Lints
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    # Clean-tree build measured ~8.5 min (ui-logic-editor alone is ~6.5 min).
    # Without this, a hang would run to GitHub's 6h default.
    timeout-minutes: 30
    env:
      PNPM_VERSION: "12.14.0"
    defaults:
      run:
        # frontend/ is the pnpm workspace root (pnpm-workspace.yaml + pnpm-lock.yaml live here).
        # Top-level packages/ and plugins/ entries without a package.json are ignored by pnpm.
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned: no .nvmrc and no engines field. Vite 6 needs >=18; @types/node is ^22.
          node-version: '22'

      - name: Install pnpm
        run: |
          # Pinned: frontend/package.json has no packageManager field, so nothing would
          # otherwise select a version. This matches the version that generated pnpm-lock.yaml.
          npm install --global "pnpm@$PNPM_VERSION"
          # The store goes beside the workspace, on its file system, where the cache step below
          # finds it. `--store-dir` on the install is what places it; an environment variable
          # does not.
          echo "PNPM_STORE=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - name: Verify Toolchain Versions
        run: |
          # Proof in the run log that the pinned versions above are what actually ran.
          node --version
          pnpm --version

      # The store is kept between runs by GitHub's cache, keyed by the lockfile: an exact hit
      # when the lockfile did not change, otherwise the newest store to start from. Nothing here
      # can let a wrong dependency in: `--frozen-lockfile` fails the install when pnpm-lock.yaml
      # disagrees with package.json, and pnpm verifies the content of what it takes from the
      # store. An empty store only means a slower run.
      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # REQ 2 — SUPPLY-CHAIN VERIFICATION STAYS ON, IN THE REQUIRED JOB.
      # `--frozen-lockfile` is not negotiable and is not cached away: it is what makes the install
      # fail closed when pnpm-lock.yaml disagrees with package.json, and it runs in this job, which
      # is a required context on dev. The cached store changes only where content-addressed
      # tarballs come from; the lockfile check itself still executes on every run.
      - name: Install Dependencies
        run: |
          START=$(date +%s)
          STATUS=0
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE" || STATUS=$?
          {
            echo "### Frontend job timing"
            echo ""
            echo "| phase | seconds |"
            echo "|---|---|"
            echo "| install dependencies (--frozen-lockfile) | $(( $(date +%s) - START )) |"
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Resolve Build Channel
        run: |
          # The channel the bundle belongs to, derived from the event that produced it
          # (dev/rc/release branch, tag suffix, or unknown for a PR preview or local build).
          # VITE_APP_CHANNEL is read by src/lib/appVersion.ts and rendered in the status bar.
          # Never defaulted: scripts/version.sh prints `unknown` when it cannot establish one,
          # because a defaulted channel is a fabricated measurement.
          CHANNEL="$(../scripts/version.sh --channel)"
          echo "Resolved build channel: ${CHANNEL}"
          echo "VITE_APP_CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"

      - name: Typecheck & Lint
        run: |
          START=$(date +%s)
          STATUS=0
          pnpm lint || STATUS=$?
          { echo "| typecheck + lint | $(( $(date +%s) - START )) |"; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Run Frontend Test Suite
        run: |
          START=$(date +%s)
          STATUS=0
          pnpm test || STATUS=$?
          { echo "| frontend tests | $(( $(date +%s) - START )) |"; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS

      - name: Build Frontend Bundles
        run: |
          START=$(date +%s)
          STATUS=0
          pnpm build || STATUS=$?
          { echo "| frontend build | $(( $(date +%s) - START )) |"; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $STATUS
