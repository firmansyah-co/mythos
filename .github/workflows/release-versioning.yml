name: Release Versioning & Changelog Generation

on:
  push:
    branches:
      - dev
      - rc
      - release
    tags:
      - 'v*.*.*'
  # No `branches` filter, for the same reason as ci.yml: a pull_request trigger that lists
  # base branches runs no workflow at all for a PR opened against any other base, so a
  # stacked PR shows an empty check list rather than a skipped one. This job only computes
  # a version and renders a changelog; it publishes nothing unless the run is a v* tag or a
  # push to release, so a feature-based PR is safe (and cheap) to include. Such a PR's
  # `github.base_ref` is its feature branch and its computed tag is a `-dev.N+prN` preview.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  version-and-changelog:
    name: Compute SemVer & Generate Changelog
    runs-on: arc-runner-org
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Target Version / Tag
        id: vars
        # The derivation lives in scripts/version.sh, not in YAML, so it can be run and
        # tested locally. It reads the last tag, counts commits since it, and builds the tag
        # name; the manifests are stamped from it on the gated promotion path.
        run: ./scripts/version.sh --print

      - name: Check Tag Exists (precondition for any release)
        id: tagexists
        # A release must never create its own tag. GitHub's create-release API creates a missing
        # tag from target_commitish, which defaults to the default branch - so without this gate
        # a push to `release` would tag dev HEAD and publish it as a final, latest release. That
        # route has no hyphen in it, so the prerelease guard alone never sees it.
        run: |
          TAG="${{ steps.vars.outputs.tag_name }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "TAG PRECONDITION: ${TAG} exists at $(git rev-parse --short "refs/tags/${TAG}^{commit}")."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "TAG PRECONDITION: ${TAG} does NOT exist in this checkout."
          fi

      - name: Resolve Release Posture
        id: posture
        # The whole decision lives in scripts/release-posture.sh so it can be run and checked
        # outside CI; its printed line IS the gate the release step obeys.
        run: ./scripts/release-posture.sh "${{ steps.vars.outputs.tag_name }}" "${{ steps.tagexists.outputs.exists }}"

      - name: Install Prebuilt git-cliff
        run: |
          mkdir -p /tmp/bin
          # Download to a file, then unpack. The previous form piped curl into tar, which
          # hides the real failure: a truncated response surfaced only as "gzip: stdin:
          # unexpected end of file / tar: Unexpected EOF in archive", with curl's own exit
          # code swallowed by the pipeline. -f makes curl fail on an HTTP error, and
          # --retry-all-errors also covers the partial-transfer and DNS cases that plain
          # --retry ignores - the exact truncation seen in run 40276789567.
          curl -fsSL \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/git-cliff.tar.gz \
            https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp/bin --strip-components=1
          /tmp/bin/git-cliff --version
          echo "/tmp/bin" >> $GITHUB_PATH

      - name: Generate Changelog using git-cliff
        run: |
          /tmp/bin/git-cliff --config cliff.toml --tag ${{ steps.vars.outputs.tag_name }} --output CHANGELOG.md

      - name: Create Release Tag (gated, outward-facing)
        # Only a promotion to rc or release can create a tag. The first tag is a deliberate
        # release decision, not a side effect of a build, so this refuses unless the repository
        # variable VERSION_TAG_PUSH_ENABLED is exactly "true". Until then it prints what it
        # WOULD create and exits 0 - a dry run, not a silent no-op.
        if: github.event_name == 'push' && (github.ref_name == 'rc' || github.ref_name == 'release')
        # NOTE FOR WHOEVER ENABLES THE FLAG: promotion is a TWO-run operation, not one. Posture has
        # already run by the time this step creates the tag, so this run prints RELEASE: NONE. The
        # release then lands on the NEXT promotion push, once the tag already exists - a tag pushed
        # by the workflow with GITHUB_TOKEN does not re-trigger the workflow. Enabling
        # VERSION_TAG_PUSH_ENABLED and pushing once will look like the release silently failed.
        env:
          TAG_PUSH_ENABLED: ${{ vars.VERSION_TAG_PUSH_ENABLED }}
        run: |
          TAG="${{ steps.vars.outputs.tag_name }}"
          if [ "${TAG_PUSH_ENABLED:-false}" != "true" ]; then
            echo "DRY RUN: would create annotated tag ${TAG} at ${GITHUB_SHA} and push it."
            echo "REFUSED: repository variable VERSION_TAG_PUSH_ENABLED is not 'true'."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} already exists; bump the base version before promoting"
            exit 1
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed annotated tag ${TAG}."

      - name: Create or Update GitHub Release
        # A dev or rc tag never creates a release: posture.create is false for any tag with a
        # prerelease identifier, so there is no API call to get wrong. The previous form
        # published on ANY v* tag with draft:false and no prerelease flag, which would have
        # presented v0.1.0-dev.0 as the Latest release.
        uses: softprops/action-gh-release@v2
        if: steps.posture.outputs.create == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref_name == 'release'))
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          # Defence in depth: even a permitted release points at the commit that was built,
          # never at whatever the default branch happens to be when the API is called.
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.vars.outputs.tag_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ steps.posture.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.posture.outputs.make_latest == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
